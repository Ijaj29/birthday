<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Happy Birthday Kaustubh (Chamadi) 🎈</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Nunito:wght@600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2a6b;--pink:#ff3d8b;--orange:#ff8a1f;--violet:#7a4dff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:#fff4f0;background-image:linear-gradient(160deg,#fff1f5 0%,#fff6e6 35%,#eaf7ff 70%,#f1ecff 100%);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(50px);opacity:.55;z-index:0;animation:drift 12s ease-in-out infinite alternate}
.o1{width:40vmax;height:40vmax;left:-10vmax;top:-10vmax;background:#ffd0e4}
.o2{width:36vmax;height:36vmax;right:-8vmax;bottom:-8vmax;background:#cfe9ff;animation-delay:-4s}
.o3{width:28vmax;height:28vmax;left:40%;top:30%;background:#fff0b8;animation-delay:-8s}
@keyframes drift{to{transform:translate(30px,-24px) scale(1.12)}}
.chip{position:fixed;left:0;top:0;z-index:1;pointer-events:none;max-width:min(70vw,300px);padding:10px 16px;border-radius:18px;background:rgba(255,255,255,.78);border:1.5px solid rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(122,77,255,.16);font-weight:700;font-size:.95rem;line-height:1.35;color:var(--ink);opacity:0;will-change:transform,opacity}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.balloon{position:fixed;bottom:-170px;z-index:3;cursor:pointer;width:var(--w);animation:rise var(--d) linear forwards;will-change:transform}
.balloon svg{display:block;width:100%;height:auto;overflow:visible;animation:sway 3s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes rise{to{transform:translateY(calc(-100vh - 340px))}}
@keyframes sway{from{transform:rotate(-6deg) translateX(-8px)}to{transform:rotate(6deg) translateX(8px)}}
.stage{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;pointer-events:none}
.script{font-family:'Pacifico',cursive;font-size:clamp(1.6rem,6vw,3rem);color:var(--pink);margin:0;text-shadow:0 3px 0 #fff;animation:fade 1s .2s backwards}
h1{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:900;line-height:1;font-size:clamp(3.6rem,18vw,12rem);display:flex;justify-content:center;flex-wrap:wrap}
h1 span{display:inline-block;background:linear-gradient(120deg,var(--pink),var(--orange) 35%,var(--violet) 70%,var(--pink));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(255,255,255,.95)) drop-shadow(0 10px 18px rgba(255,61,139,.25));animation:pop .9s cubic-bezier(.2,1.6,.4,1) backwards,shine 6s linear infinite,bob 3s ease-in-out infinite;animation-delay:calc(var(--n)*.12s + .3s),0s,calc(var(--n)*.2s)}
@keyframes pop{from{transform:translateY(90px) scale(.2) rotate(-20deg);opacity:0}}
@keyframes shine{to{background-position:250% 0}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.82rem;color:#8b6aa8;z-index:4;pointer-events:none;animation:fade 1s 1.5s backwards}
@media (prefers-reduced-motion:reduce){h1 span,.balloon svg,.orb{animation:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="stage">
  <p class="script">Happy Birthday</p>
  <h1 id="name" aria-label="Kaustubh"></h1>
  <h1 id="surname" aria-label="(Chamadi)"></h1>
</main>
<div class="hint">Tap anywhere for crackers 🎆 · pop the balloons 🎈</div>

<script>
(function(){
var nm=document.getElementById('name');
var sn=document.getElementById('surname');
'Kaustubh'.split('').forEach(function(c,i){var s=document.createElement('span');s.textContent=c;s.style.setProperty('--n',i);nm.appendChild(s);});
'(Chamadi)'.split('').forEach(function(c,i){var s=document.createElement('span');s.textContent=c;s.style.setProperty('--n',i);sn.appendChild(s);});

var wishes=[
'May your day sparkle brighter than every firework 🎆','Happy Birthday, Kaustubh (Chamadi)! Today the world is yours 🌍','Wishing you laughter, love and lots of cake 🎂','Another year of being awesome. Keep shining! ✨','May all your dreams take flight like balloons 🎈','You make every room warmer just by being in it 💛','Cheers to new adventures and golden moments 🥂','Age is just a number; your joy is limitless 🎉','May this year bring you everything you wish for 🌟','Good vibes, great food and endless smiles today 😄','Life is a gift, and so are you, Kaustubh (Chamadi) 🎁','Today we celebrate the wonderful you 💖','May happiness follow you all year long 🌈','Blow out the candles and make it a big wish 🕯️','Here’s to a year full of joy and sweet surprises 🍬','You deserve all the happiness in the world 🌸','Stay curious, stay kind, stay you 🌻','Not old, just a limited edition 😎','Eat cake first, worry later 🍰','May your Wi-Fi be strong and your worries weak 📶','Every candle is a star, every star a wish ⭐','Be happy. Be bright. Be you. 💫','The best is yet to come, Kaustubh (Chamadi) 🚀','Sending you hugs, smiles and confetti 🎊','Your smile lights up the whole sky 🌤️','Make today unforgettable! 🥳','Dream big, laugh louder, love deeper 💕','Hip hip hooray, it’s your day! 🙌','Grow older, never grow dull 🎶','Another trip around the sun, beautifully done ☀️','Wishing you peace, health and endless success 🌺','Today is for dancing, cake and you 💃','Let the lanterns rise for you tonight 🏮','Thank you for being you, Kaustubh (Chamadi) 🤗','May your heart stay young and your spirit free 🕊️','You’re the gift that keeps on giving 🎀'
];
var n=0;
// two lanes: A drifts to top-left corner, B drifts to bottom-right corner
function chip(lane){
  var el=document.createElement('div');el.className='chip';el.textContent=wishes[n++%wishes.length];document.body.appendChild(el);
  var W=innerWidth,H=innerHeight,j=(Math.random()-.5)*.12,s,e;
  if(lane===0){s=[W*(.42+j),H*.78];e=[-W*.08,H*.02];}
  else{s=[W*(.55+j),H*.22];e=[W*1.02,H*.96];}
  if(lane===0){s[0]-=60;}
  var dur=(innerWidth<600?9000:11000);
  var a=el.animate([
    {transform:'translate('+s[0]+'px,'+s[1]+'px) scale(.7)',opacity:0},
    {opacity:1,offset:.15},
    {opacity:1,offset:.6},
    {transform:'translate('+e[0]+'px,'+e[1]+'px) scale(.9)',opacity:0}
  ],{duration:dur,easing:'ease-in-out'});
  a.onfinish=function(){el.remove();};
}
var lane=0;
function nextChip(){if(!document.hidden){chip(lane);lane=1-lane;}}
nextChip();setTimeout(nextChip,900);
setInterval(nextChip,1900);

// balloons
var bc=['#ff5c93','#ffb02e','#4cc9f0','#8f6bff','#3ddc97','#ff7a59','#f7d94c'];
function balloon(){
  var c=bc[Math.floor(Math.random()*bc.length)],w=52+Math.random()*44,b=document.createElement('div');
  b.className='balloon';b.style.setProperty('--w',w+'px');b.style.setProperty('--d',(11+Math.random()*7)+'s');
  b.style.left=(Math.random()*92)+'vw';b.dataset.c=c;
  b.innerHTML='<svg viewBox="0 0 60 100"><path d="M30 2C12 2 3 18 3 33c0 17 14 31 27 31s27-14 27-31C57 18 48 2 30 2z" fill="'+c+'"/><ellipse cx="19" cy="20" rx="6" ry="10" fill="#fff" opacity=".5" transform="rotate(25 19 20)"/><path d="M26 64h8l-4 7z" fill="'+c+'"/><path d="M30 71c-6 8 6 14 0 22s5 6 0 7" stroke="#b9a3cf" stroke-width="1.5" fill="none"/></svg>';
  b.addEventListener('pointerdown',function(e){e.stopPropagation();var r=b.getBoundingClientRect();pop(r.left+r.width/2,r.top+r.height*.35,c);b.remove();});
  b.addEventListener('animationend',function(){b.remove();});
  document.body.appendChild(b);
}
for(var i=0;i<6;i++)setTimeout(balloon,i*450);
setInterval(function(){if(!document.hidden)balloon();},1300);

// crackers
var cv=document.getElementById('fx'),ctx=cv.getContext('2d'),P=[],R=[],dpr=Math.min(devicePixelRatio||1,2);
function size(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
size();addEventListener('resize',size);
var pal=['#ff2d7a','#ff8a00','#00a8e8','#7a4dff','#00b87a','#f03e3e','#e6a800'];
function burst(x,y,col){
  var c=col||pal[Math.floor(Math.random()*pal.length)],c2=pal[Math.floor(Math.random()*pal.length)],k=76;
  for(var i=0;i<k;i++){var a=Math.PI*2*i/k,s=1.6+Math.random()*3.8;
    P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.008+Math.random()*.012,c:i%3?c:c2,z:2+Math.random()*1.6});}
}
function pop(x,y,c){burst(x,y,c);}
function launch(x){R.push({x:x,y:innerHeight,ty:innerHeight*(.1+Math.random()*.4),vy:-9-Math.random()*3});}
function frame(){
  ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.globalCompositeOperation='source-over';
  for(var i=R.length-1;i>=0;i--){var r=R[i];r.y+=r.vy;r.vy*=.985;
    ctx.fillStyle='#ff8a00';ctx.beginPath();ctx.arc(r.x,r.y,2.4,0,7);ctx.fill();
    if(r.y<=r.ty||r.vy>-2){burst(r.x,r.y);R.splice(i,1);}}
  for(var j=P.length-1;j>=0;j--){var p=P[j];p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.vy*=.985;p.l-=p.d;
    if(p.l<=0){P.splice(j,1);continue;}
    ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.z*p.l+.5,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(function(){if(!document.hidden)launch(innerWidth*(.1+Math.random()*.8));},1400);
setTimeout(function(){launch(innerWidth*.25);launch(innerWidth*.75);},500);
document.addEventListener('pointerdown',function(e){burst(e.clientX,e.clientY);});
})();
</script>
</body>
</html>
